<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="1280" viewBox="0 0 1280 1280" role="img" aria-labelledby="title description">
<title id="title">EspLang architecture: shared frontend, two build pipelines</title><desc id="description">The shared lexer, parser and semantic analyzer feed either our native Xtensa generator, assembler, linker and image packager, or our C++ generator and external Arduino tools. Native uploads use esptool; browser uploads use esptool-js. Hosted Docker workers currently run Arduino builds.</desc>
<defs><pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse"><path d="M40 0H0V40" fill="none" stroke="#31485c" stroke-opacity=".22"/></pattern><radialGradient id="glow"><stop stop-color="#22664e" stop-opacity=".55"/><stop offset="1" stop-color="#101923" stop-opacity="0"/></radialGradient></defs>
<rect width="1280" height="1280" rx="20" fill="#0c1420"/><rect width="1280" height="1280" rx="20" fill="url(#grid)"/>
<g font-family="Segoe UI,Arial,sans-serif">
  <text x="50" y="44" font-size="13" fill="#89e8be" letter-spacing="2">ARCHITECTURE / OWNERSHIP AT EVERY STAGE</text>
  <text x="50" y="98" font-size="38" fill="#edf5fa" font-weight="650">From language design to a blinking LED.</text>
  <text x="50" y="134" font-size="18" fill="#a0b1c5" >Mint: our compiler stages  ·  Amber: Arduino toolchain  ·  Blue: upload tools</text>
  <rect x="50" y="164" width="1180" height="144" rx="14" fill="#10231f" stroke="#35664e"/>
  <text x="74" y="193" font-size="13" fill="#89e8be" letter-spacing="1.5">SHARED FRONTEND / program.esp</text>
  <text x="74" y="235" font-size="25" fill="#edf5fa" >01  Lexer</text><text x="74" y="272" font-size="16" fill="#a0b1c5" >Characters → tokens + source locations</text>
  <text x="465" y="235" font-size="25" fill="#edf5fa" >02  Parser + AST</text><text x="465" y="272" font-size="16" fill="#a0b1c5" >Tokens → structured program</text>
  <text x="863" y="235" font-size="25" fill="#edf5fa" >03  Semantic checks</text><text x="863" y="272" font-size="16" fill="#a0b1c5" >Types · scopes · GPIO diagnostics</text>
  <path d="M640 308V330H332V344 M640 330H948V344" stroke="#89e8be" fill="none" stroke-width="2"/>
  <text x="50" y="373" font-size="22" fill="#89e8be" font-weight="700">NATIVE v0.1</text>
  <text x="50" y="400" font-size="17" fill="#a0b1c5" >Original ESP32 · CLI/API · supported subset</text>
  <text x="666" y="373" font-size="22" fill="#f3c888" font-weight="700">ARDUINO WORKFLOW</text>
  <text x="666" y="400" font-size="17" fill="#a0b1c5" >ESP32 / S2 / S3 / C3 / C6 · browser IDE</text>
  <rect x="50" y="424" width="564" height="100" rx="14" fill="#122821" stroke="#35664e"/>
  <text x="72" y="449" font-size="11" fill="#89e8be" letter-spacing="1.5">OUR NATIVE CODE + RUNTIME GENERATOR</text>
  <text x="72" y="481" font-size="23" fill="#edf5fa" font-weight="600">Xtensa assembly → program.s</text>
  <text x="72" y="507" font-size="16" fill="#a0b1c5" >Startup · fixed registers · GPIO · cycle-counter delays</text>
  <rect x="666" y="424" width="564" height="100" rx="14" fill="#122821" stroke="#35664e"/>
  <text x="688" y="449" font-size="11" fill="#89e8be" letter-spacing="1.5">OUR C++ GENERATOR</text>
  <text x="688" y="481" font-size="23" fill="#edf5fa" font-weight="600">Arduino source → main.cpp</text>
  <text x="688" y="507" font-size="16" fill="#a0b1c5" >Source mappings · runtime guards · hardware wrappers</text>
  <path d="M332 528L332 550" stroke="#89e8be" stroke-width="2" fill="none"/><path d="M327 542L332 550L337 542" stroke="#89e8be" stroke-width="2" fill="none"/><path d="M948 528L948 550" stroke="#f3c888" stroke-width="2" fill="none"/><path d="M943 542L948 550L953 542" stroke="#f3c888" stroke-width="2" fill="none"/>
  <rect x="50" y="556" width="564" height="100" rx="14" fill="#122821" stroke="#35664e"/>
  <text x="72" y="581" font-size="11" fill="#89e8be" letter-spacing="1.5">OUR ASSEMBLER + SINGLE-SECTION LINKER</text>
  <text x="72" y="613" font-size="23" fill="#edf5fa" font-weight="600">Assembly → machine instructions</text>
  <text x="72" y="639" font-size="16" fill="#a0b1c5" >Encode bytes · resolve labels · lay out code and literals</text>
  <rect x="666" y="556" width="564" height="100" rx="14" fill="#28241d" stroke="#695337"/>
  <text x="688" y="581" font-size="11" fill="#f3c888" letter-spacing="1.5">EXTERNAL ARDUINO / ESPRESSIF TOOLS</text>
  <text x="688" y="613" font-size="23" fill="#edf5fa" font-weight="600">Arduino CLI → GCC + SDK libraries</text>
  <text x="688" y="639" font-size="16" fill="#a0b1c5" >C++ compilation · assembly · linking · image tools</text>
  <path d="M332 660L332 682" stroke="#89e8be" stroke-width="2" fill="none"/><path d="M327 674L332 682L337 674" stroke="#89e8be" stroke-width="2" fill="none"/><path d="M948 660L948 682" stroke="#f3c888" stroke-width="2" fill="none"/><path d="M943 674L948 682L953 674" stroke="#f3c888" stroke-width="2" fill="none"/>
  <rect x="50" y="688" width="564" height="100" rx="14" fill="#122821" stroke="#35664e"/>
  <text x="72" y="713" font-size="11" fill="#89e8be" letter-spacing="1.5">OUR FIRMWARE IMAGE BUILDER</text>
  <text x="72" y="745" font-size="23" fill="#edf5fa" font-weight="600">program.bin + program.map.json</text>
  <text x="72" y="771" font-size="16" fill="#a0b1c5" >ROM headers · IRAM/DRAM segments · XOR checksum</text>
  <rect x="666" y="688" width="564" height="100" rx="14" fill="#28241d" stroke="#695337"/>
  <text x="688" y="713" font-size="11" fill="#f3c888" letter-spacing="1.5">ARDUINO IMAGES / CHECKED BY OUR SERVER</text>
  <text x="688" y="745" font-size="23" fill="#edf5fa" font-weight="600">Bootloader + partitions + application</text>
  <text x="688" y="771" font-size="16" fill="#a0b1c5" >Sparse images · bounds checks · SHA-256 manifest</text>
  <path d="M332 792L332 814" stroke="#91baff" stroke-width="2" fill="none"/><path d="M327 806L332 814L337 806" stroke="#91baff" stroke-width="2" fill="none"/><path d="M948 792L948 814" stroke="#91baff" stroke-width="2" fill="none"/><path d="M943 806L948 814L953 806" stroke="#91baff" stroke-width="2" fill="none"/>
  <rect x="50" y="820" width="564" height="100" rx="14" fill="#142237" stroke="#375881"/>
  <text x="72" y="848" font-size="11" fill="#91baff" letter-spacing="1.5">EXTERNAL UPLOAD TOOL</text>
  <text x="72" y="880" font-size="23" fill="#edf5fa" >esptool --no-stub → chip ROM</text>
  <text x="72" y="906" font-size="15" fill="#a0b1c5" >One native image at 0x1000; separate from IDE flashing</text>
  <rect x="666" y="820" width="564" height="100" rx="14" fill="#142237" stroke="#375881"/>
  <text x="688" y="848" font-size="11" fill="#91baff" letter-spacing="1.2">EXTERNAL USB LIBRARY / OUR IDE INTEGRATION</text>
  <text x="688" y="880" font-size="23" fill="#edf5fa" >esptool-js + Web Serial → board</text>
  <text x="688" y="906" font-size="16" fill="#a0b1c5" >Chip checks · verified writes · serial monitoring</text>
  <path d="M332 924L332 946" stroke="#89e8be" stroke-width="2" fill="none"/><path d="M327 938L332 946L337 938" stroke="#89e8be" stroke-width="2" fill="none"/>
  <rect x="50" y="952" width="1180" height="112" rx="14" fill="#10231f" stroke="#35664e"/>
  <text x="74" y="985" font-size="12" fill="#89e8be" letter-spacing="1.5">NATIVE HARDWARE MILESTONE</text>
  <text x="74" y="1020" font-size="25" fill="#edf5fa" >ESP32-D0WD-V3: verified upload + user-reported LED blink</text>
  <text x="74" y="1048" font-size="16" fill="#a0b1c5" >1,536-byte image · 464 code/pool bytes · power-cycle persistence and measured timing pending</text>
  <rect x="50" y="1096" width="1180" height="132" rx="14" fill="#152131" stroke="#304255"/>
  <text x="74" y="1127" font-size="12" fill="#91baff" letter-spacing="1.5">HOSTED ARDUINO BUILDS / DEPLOYMENT PREPARED</text>
  <text x="74" y="1162" font-size="24" fill="#edf5fa" >HTTPS → signed session → bounded queue → disposable Docker worker</text>
  <text x="74" y="1190" font-size="16" fill="#a0b1c5" >Quotas · cancellation · CPU/RAM/time limits · no worker network · USB stays in the browser</text>
  <text x="74" y="1213" font-size="15" fill="#a0b1c5" >Real Linux deployment test passed. Public production provisioning is still required.</text>
  <text x="1230" y="1260" font-size="13" fill="#a0b1c5" text-anchor="end">See README for feature limits and evidence boundaries.</text>
</g></svg>

  <text x="116" y="63" font-size="13" fill="#8ce8be" letter-spacing="3">A LANGUAGE FOR THE THINGS YOU BUILD</text>
  <text x="116" y="86" font-size="11" fill="#788ba4" letter-spacing="1.9">CUSTOM COMPILER  /  LOCAL WEB IDE  /  DIRECT USB</text>
  <text x="48" y="173" font-size="76" fill="#eff7fa" font-weight="700" letter-spacing="-3">EspLang Studio</text>
  <text x="52" y="221" font-size="35" fill="#8ce8be" font-weight="500">From source to silicon.</text>
  <text x="52" y="260" font-size="21" fill="#a1aec3" >Write hardware. See the whole pipeline.</text>

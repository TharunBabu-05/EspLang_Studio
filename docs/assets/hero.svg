<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="480" viewBox="0 0 1280 480" role="img" aria-labelledby="title description">
<title id="title">EspLang Native: our compiler, assembler and firmware builder</title><desc id="description">EspLang source compiles to ESP32 firmware through our own Xtensa compiler, assembler, linker and ROM image builder. No C++ conversion is used in the native build. Targets original ESP32-WROOM-32.</desc>
<defs><pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse"><path d="M40 0H0V40" fill="none" stroke="#31485c" stroke-opacity=".22"/></pattern><radialGradient id="glow"><stop stop-color="#22664e" stop-opacity=".55"/><stop offset="1" stop-color="#101923" stop-opacity="0"/></radialGradient></defs>
<rect width="1280" height="480" rx="20" fill="#0c1420"/><rect width="1280" height="480" rx="20" fill="url(#grid)"/>
<g font-family="Segoe UI,Arial,sans-serif">
  <ellipse cx="1030" cy="245" rx="330" ry="250" fill="url(#glow)"/>
  <text x="48" y="49" font-size="13" fill="#89e8be" letter-spacing="3">ESPLANG / SOURCE TO SILICON</text>
  <text x="48" y="132" font-size="70" fill="#edf5fa" font-weight="700" letter-spacing="-2">EspLang Studio</text>
  <text x="50" y="184" font-size="29" fill="#89e8be" >Our language. Our native toolchain.</text>
  <text x="50" y="224" font-size="20" fill="#a0b1c5" >Compile .esp directly into ESP32 .bin firmware.</text>
  <rect x="50" y="255" width="705" height="57" rx="14" fill="#122b25" stroke="#35664e"/>
  <text x="70" y="279" font-size="11" fill="#89e8be" letter-spacing="1.4">NATIVE COMPILATION / NO C++ CONVERSION</text>
  <text x="70" y="300" font-size="19" fill="#edf5fa" font-family="Consolas,monospace">.esp → our compiler → Xtensa assembly</text>
  <rect x="50" y="325" width="705" height="57" rx="14" fill="#122b25" stroke="#35664e"/>
  <text x="70" y="349" font-size="11" fill="#89e8be" letter-spacing="1.4">OUR ASSEMBLER + LINKER + FIRMWARE BUILDER</text>
  <text x="70" y="370" font-size="19" fill="#edf5fa" font-family="Consolas,monospace">Assembly → machine code → ROM image → .bin</text>
  <path d="M873 136h-20 M1133 136h20" stroke="#7caba3" stroke-width="6"/><path d="M873 160h-20 M1133 160h20" stroke="#7caba3" stroke-width="6"/><path d="M873 184h-20 M1133 184h20" stroke="#7caba3" stroke-width="6"/><path d="M873 208h-20 M1133 208h20" stroke="#7caba3" stroke-width="6"/><path d="M873 232h-20 M1133 232h20" stroke="#7caba3" stroke-width="6"/><path d="M873 256h-20 M1133 256h20" stroke="#7caba3" stroke-width="6"/><path d="M873 280h-20 M1133 280h20" stroke="#7caba3" stroke-width="6"/><path d="M873 304h-20 M1133 304h20" stroke="#7caba3" stroke-width="6"/>
  <rect x="873" y="112" width="260" height="238" rx="18" fill="#203d3b" stroke="#6daba0"/>
  <rect x="892" y="131" width="222" height="200" rx="8" fill="#c4d8d6" stroke="#dfebe5"/>
  <text x="915" y="191" font-size="44" fill="#173c3b" font-weight="700">ESP32</text>
  <text x="917" y="227" font-size="18" fill="#28524d" letter-spacing="2">XTENSA LX6</text>
  <text x="917" y="272" font-size="17" fill="#173c3b" font-weight="700">OUR CODE</text>
  <text x="917" y="297" font-size="17" fill="#173c3b" font-weight="700">REAL HARDWARE</text>
  <text x="1003" y="380" font-size="17" fill="#89e8be" text-anchor="middle">Native v0.1 · experimental</text>
  <path d="M48 409H1232" stroke="#304255"/>
  <text x="50" y="444" font-size="13" fill="#89e8be" >OWN COMPILER + ASSEMBLER + BUILDER</text>
  <text x="565" y="444" font-size="13" fill="#91baff" >ORIGINAL ESP32 / XTENSA LX6</text>
  <text x="1230" y="444" font-size="13" fill="#89e8be" text-anchor="end">NATIVE LED BLINK REPORTED</text>
</g></svg>

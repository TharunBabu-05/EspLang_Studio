  <text x="842" y="182" font-size="46" fill="#1f3540" font-weight="700">ESP</text><text x="842" y="237" font-size="60" fill="#1f3540" font-weight="700">32</text>
  <text x="842" y="277" font-size="9" fill="#2a4650" letter-spacing="1.2">YOUR CODE. REAL HARDWARE.</text>
